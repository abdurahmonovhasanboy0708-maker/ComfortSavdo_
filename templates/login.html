{% extends 'base/base.html' %}
{% load static %}

{% block title %}Kirish — Comfort Savdo{% endblock %}

{% block extra_css %}
<style>
.auth-wrap{display:grid;place-items:center;padding:40px 16px}
form.auth{background:#fff;border:1px solid #e2e7ee;border-radius:18px;padding:28px;width:100%;max-width:400px;display:grid;gap:12px}
.logo{font-size:3rem;text-align:center}
form.auth label{font-size:.85rem;color:#6b7686;display:grid;gap:4px}
form.auth input{font:inherit;padding:11px 12px;border:1px solid #e2e7ee;border-radius:10px}
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
<form class="auth" method="post">
 {% csrf_token %}
 <div class="logo">🛒</div><h2 style="text-align:center">Kirish</h2>

 {% if messages %}
     {% for message in messages %}
         <p style="color:#c0392b;font-size:.9rem">{{ message }}</p>
     {% endfor %}
 {% endif %}

 <label>Telefon raqam<input name="phone_number" required placeholder="+998 90 123 45 67"></label>
 <label>Parol<input name="password" type="password" required></label>
 <input type="hidden" name="next" value="{{ request.GET.next }}">
 <button type="submit" class="btn" style="height:44px">Kirish</button>
</form>
</div>
{% endblock %}
