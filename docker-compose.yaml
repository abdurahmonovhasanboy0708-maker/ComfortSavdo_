name: comfortsavdo
services:
  web:
    build: .
    container_name: comfort_savdo_web
    restart: unless-stopped
    command: gunicorn comfortsavdo.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env